name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Audit the proposed publication history, not GitHub synthetic merge metadata.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install validation dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install chezmoi shellcheck gitleaks starship
          else
            sudo apt-get update
            sudo apt-get install -y zsh shellcheck
            ./bootstrap.sh --dependencies-only --non-interactive
            PATH="$HOME/.local/bin:$PATH" bin/dotfiles tools install starship --non-interactive
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Public file policy
        env:
          GIT_AUTHOR_NAME: phcorp
          GIT_COMMITTER_NAME: phcorp
          GIT_AUTHOR_EMAIL: phcorp@users.noreply.github.com
          GIT_COMMITTER_EMAIL: phcorp@users.noreply.github.com
        run: scripts/check-public.sh
      - name: Shell lint
        shell: bash
        run: |
          mapfile_fallback() { find bin lib scripts tests -type f -name '*.sh' -print; }
          mapfile_fallback | while IFS= read -r file; do shellcheck --shell=sh "$file"; done
          shellcheck --shell=sh bootstrap.sh bin/dotfiles scripts/git-hooks/pre-commit scripts/git-hooks/pre-push
      - name: Lifecycle behavior
        run: tests/run.sh
      - name: Secret scan
        if: runner.os == 'macOS'
        run: |
          gitleaks git --redact
          gitleaks dir --redact
  native-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:12, fedora:43]
    container: ${{ matrix.image }}
    steps:
      - name: Prepare native package manager
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git curl ca-certificates python3 bash zsh unzip
          else
            dnf install -y git curl ca-certificates python3 bash zsh unzip
          fi
      - uses: actions/checkout@v4
      - name: Install native CLI tools in disposable home
        shell: sh
        run: |
          export HOME="$(mktemp -d)"
          export DOTFILES_SOURCE="$GITHUB_WORKSPACE"
          export DOTFILES_CONFIG="$HOME/.config/dotfiles"
          export DOTFILES_STATE="$HOME/.local/state/dotfiles"
          export DOTFILES_MODE=non-interactive
          ./bootstrap.sh --dependencies-only --non-interactive
          export PATH="$HOME/.local/bin:$PATH"
          tests/run.sh
          for tool in ripgrep tmux eza starship fd bat; do
            bin/dotfiles tools install "$tool" --non-interactive
          done
          rg --version
          tmux -V
          eza --version
          starship --version
          fd --version
          bat --version
